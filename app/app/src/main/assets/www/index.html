<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10182b"><meta name="description" content="Sanew Stars — мобильная арена с ботами и кристаллами."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sanew Stars"><title>Sanew Stars — Арена</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10182b;color:#fff;font-family:system-ui,Arial;touch-action:none}#game{display:block;width:100vw;height:100dvh;background:#6fbd63}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px 15px;font-weight:900;text-shadow:0 2px 3px #0008}.pill{background:#15243ddd;border:2px solid #ffffff35;border-radius:14px;padding:7px 12px}.help{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:0 2px 3px #000;text-align:center}.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 22px;pointer-events:none}.stick{width:116px;height:116px;border-radius:50%;background:#17243b66;border:3px solid #ffffff70;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:#fff9;border:2px solid white}.actions{display:flex;gap:14px;align-items:end;pointer-events:auto}.act{border:3px solid #fff9;border-radius:50%;width:76px;height:76px;background:#ffcf35;color:#412b00;font-weight:1000;font-size:14px;box-shadow:0 5px 0 #a56b16;touch-action:none}.act.super{width:64px;height:64px;background:#9a68ff;color:white}.panel{position:fixed;inset:0;display:grid;place-items:center;background:#08101dcc;z-index:5}.card{width:min(90vw,430px);padding:25px;border-radius:24px;background:#1b2c49;border:2px solid #ffffff30;text-align:center;box-shadow:0 20px 70px #0008}.card h1{font-size:34px;margin:0 0 8px}.card p{color:#d4e1f5}.install{border:2px solid #ffffff55;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:800;background:#31476b;color:#fff;margin:0 6px 12px}.start{border:0;border-radius:15px;padding:14px 28px;font-size:18px;font-weight:900;background:#ffcf35;color:#392700}.hidden{display:none}.bar{height:9px;width:130px;background:#293b54;border-radius:20px;overflow:hidden;margin:6px auto}.fill{height:100%;background:#60e1a4;width:100%}
</style></head><body>
<canvas id="game"></canvas><div class="hud"><div class="top"><div class="pill">⭐ <span id="trophies">0</span></div><div class="pill">💎 <span id="gems">0</span>/10</div><div class="pill">❤️ <span id="hp">100</span></div></div><div class="help">Собери 10 кристаллов или победи ботов!</div><div class="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="act super" id="super">СУПЕР</button><button class="act" id="attack">АТАКА</button></div></div></div>
<div class="panel" id="intro"><div class="card"><h1>⭐ SANEW STARS</h1><p>Добро пожаловать на арену! Управляй бойцом, собирай кристаллы и побеждай соперников.</p><p>На телефоне — джойстик и кнопки. На компьютере — WASD и пробел.</p><button class="install hidden" id="install">УСТАНОВИТЬ ПРИЛОЖЕНИЕ</button><br><button class="start" id="play">ИГРАТЬ</button></div></div>
<div class="panel hidden" id="result"><div class="card"><h1 id="resultTitle">ПОБЕДА!</h1><p id="resultText"></p><button class="start" id="again">ЕЩЁ БОЙ</button></div></div>
<script>
let installPrompt=null;
const installButton=document.getElementById('install');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.classList.remove('hidden')});
installButton.addEventListener('click',async()=>{if(!installPrompt){alert('Чтобы установить игру: открой меню браузера ⋮ и выбери «Установить приложение» или «Добавить на главный экран».');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.classList.add('hidden')});
window.addEventListener('appinstalled',()=>installButton.classList.add('hidden'));
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script><script src="game.js"></script></body></html>
